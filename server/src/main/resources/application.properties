server.port=${SERVER_PORT:9090}

# MySQL
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3307/media_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Upload limits
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:2048MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:2048MB}

# MyBatis Plus
mybatis-plus.configuration.log-impl=${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.stdout.StdOutImpl}

# DeepSeek / OpenAI-compatible chat model
ai.deepseek.api-key=${DEEPSEEK_API_KEY:}
ai.deepseek.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}

# Aliyun ASR
ai.aliyun.api-key=${ALIYUN_API_KEY:}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.timeout=${REDIS_TIMEOUT:3000ms}

# Daily AI token quota per user. Redis key: user:token:usage:{userId}
ai.token.daily-quota=${AI_TOKEN_DAILY_QUOTA:50000}

# MinIO
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.accessKey=${MINIO_ACCESS_KEY:minioadmin}
minio.secretKey=${MINIO_SECRET_KEY:minioadmin}
minio.bucketName=${MINIO_BUCKET:media}
minio.public-endpoint=${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}

# Local tools
tool.ytdlp.path=${YTDLP_PATH:yt-dlp}
tool.ffmpeg.dir=${FFMPEG_DIR:}
media.upload-dir=${MEDIA_UPLOAD_DIR:${java.io.tmpdir}/smartvideo-uploads/}

# RocketMQ
rocketmq.name-server=${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
rocketmq.producer.group=${ROCKETMQ_PRODUCER_GROUP:video-analysis-group}
rocketmq.producer.send-message-timeout=${ROCKETMQ_SEND_TIMEOUT_MS:3000}
rocketmq.consumer.max-reconsume-times=${ROCKETMQ_MAX_RECONSUME_TIMES:3}

# Embedding / Milvus
embedding.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
embedding.model-name=${OLLAMA_EMBEDDING_MODEL:bge-large}
milvus.host=${MILVUS_HOST:localhost}
milvus.port=${MILVUS_PORT:19530}
milvus.collection-name=${MILVUS_COLLECTION:smart_video_chunks}
milvus.dimension=${MILVUS_DIMENSION:1024}
milvus.similarity-threshold=${MILVUS_SIMILARITY_THRESHOLD:0.6}

# RAG / Agent
agent.max-steps=${AGENT_MAX_STEPS:5}
agent.tool.timeout-ms=${AGENT_TOOL_TIMEOUT_MS:30000}
rag.retrieval.hybrid-enabled=${RAG_HYBRID_ENABLED:true}
rag.bm25.rebuild-on-startup=${RAG_BM25_REBUILD_ON_STARTUP:true}
rag.smoke-test.enabled=${RAG_SMOKE_TEST_ENABLED:false}
chat.memory.max-messages=${CHAT_MEMORY_MAX_MESSAGES:12}
chat.memory.summary-trigger-messages=${CHAT_MEMORY_SUMMARY_TRIGGER_MESSAGES:16}
chat.memory.ttl-days=${CHAT_MEMORY_TTL_DAYS:7}
chat.memory.summary-enabled=${CHAT_MEMORY_SUMMARY_ENABLED:true}
