<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>RAG 调试面板</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; height: 100vh; display: flex; flex-direction: column; }
        .header { background: #16213e; padding: 16px 24px; display: flex; gap: 12px; align-items: center; }
        .header input { flex: 1; padding: 10px 16px; border: 1px solid #0f3460; border-radius: 6px; background: #1a1a2e; color: #eee; font-size: 14px; }
        .header button { padding: 10px 20px; background: #e94560; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
        .header button:hover { background: #d13650; }
        .main { display: flex; flex: 1; overflow: hidden; }
        .panel { flex: 1; padding: 16px; overflow-y: auto; border-right: 1px solid #0f3460; }
        .panel:last-child { border-right: none; }
        .panel h3 { color: #e94560; margin-bottom: 12px; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
        .context-item { background: #16213e; border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; font-size: 13px; line-height: 1.5; }
        .context-item .meta { color: #888; font-size: 11px; margin-bottom: 4px; }
        .context-item .score { color: #4ecca3; }
        #answer { font-size: 14px; line-height: 1.8; white-space: pre-wrap; }
        #status { color: #888; font-style: italic; }
        .metrics { display: flex; gap: 16px; margin-bottom: 16px; }
        .metric { background: #16213e; border-radius: 6px; padding: 12px 16px; text-align: center; flex: 1; }
        .metric .val { font-size: 24px; font-weight: bold; color: #4ecca3; }
        .metric .label { font-size: 11px; color: #888; margin-top: 4px; }
    </style>
</head>
<body>
<div class="header">
    <span style="color:#e94560;font-weight:bold;">RAG Debug</span>
    <input id="question" placeholder="输入你的问题..." value="Transformer的核心组件有哪些？" />
    <input id="session" placeholder="Session ID" value="debug-session" style="max-width:180px;" />
    <button onclick="ask()">搜索</button>
</div>
<div class="main">
    <div class="panel" style="max-width: 360px;">
        <h3>检索上下文</h3>
        <div id="contexts"><span style="color:#888;">等待检索...</span></div>
    </div>
    <div class="panel" style="flex:2;">
        <h3>LLM 回答</h3>
        <div id="status">准备就绪</div>
        <div id="answer"></div>
    </div>
    <div class="panel" style="max-width: 260px;">
        <h3>指标</h3>
        <div class="metrics">
            <div class="metric"><div class="val" id="ctx-count">-</div><div class="label">检索结果</div></div>
            <div class="metric"><div class="val" id="gen-chars">-</div><div class="label">生成字数</div></div>
        </div>
    </div>
</div>
<script>
async function ask() {
    const question = document.getElementById('question').value;
    const sessionId = document.getElementById('session').value;
    document.getElementById('status').textContent = '正在检索...';
    document.getElementById('answer').textContent = '';
    document.getElementById('contexts').innerHTML = '<span style="color:#888;">等待检索...</span>';
    document.getElementById('ctx-count').textContent = '-';
    document.getElementById('gen-chars').textContent = '-';

    try {
        const resp = await fetch('/api/rag/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question, sessionId })
        });

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let charCount = 0;
        let currentEvent = 'message';
        let currentData = '';

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });

            const lines = buffer.split('\n');
            buffer = lines.pop() || '';

            for (const line of lines) {
                if (!line.trim()) {
                    // 空行表示一个事件结束
                    if (currentEvent === 'contexts' && currentData) {
                        const ctxs = JSON.parse(currentData);
                        let html = '';
                        ctxs.forEach(c => {
                            html += `<div class='context-item'>
                                <div class='meta'>[${c.index}] <span class='score'>${c.score.toFixed(3)}</span> — ${c.sourceTitle}</div>
                                <div>${c.content}</div>
                            </div>`;
                        });
                        document.getElementById('contexts').innerHTML = html;
                        document.getElementById('ctx-count').textContent = ctxs.length;
                    } else if (currentEvent === 'status' && currentData) {
                        document.getElementById('status').textContent = currentData;
                    } else if (currentEvent === 'message' && currentData) {
                        document.getElementById('answer').textContent += currentData;
                        charCount += currentData.length;
                        document.getElementById('gen-chars').textContent = charCount;
                    } else if (currentEvent === 'done') {
                        document.getElementById('status').textContent = '生成完成';
                    } else if (currentEvent === 'error') {
                        document.getElementById('status').textContent = '错误: ' + currentData;
                    }
                    currentEvent = 'message';
                    currentData = '';
                    continue;
                }
                if (line.startsWith('event:')) currentEvent = line.slice(6).trim();
                if (line.startsWith('data:')) currentData += line.slice(5);
            }
        }
    } catch (e) {
        document.getElementById('status').textContent = '连接失败: ' + e.message;
    }
}
</script>
</body>
</html>
